<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>党史党建复习测试程序</title>
<style>
  :root{
    --red:#b3261e; --red-dark:#8f1d16; --red-soft:#fdecea;
    --ink:#1c1c1e; --muted:#6b7280; --line:#e5e7eb;
    --bg:#f4f5f7; --card:#ffffff; --ok:#1a7f37; --ok-soft:#e6f4ea;
    --bad:#c62828; --warn:#b45309; --warn-soft:#fef3e2;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Microsoft YaHei","PingFang SC","Segoe UI",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
  #app{max-width:860px;margin:0 auto;padding:16px 16px 80px}

  .topbar{background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;
    padding:26px 20px;border-radius:14px;margin-bottom:20px;box-shadow:0 4px 16px rgba(179,38,30,.25)}
  .topbar h1{margin:0 0 6px;font-size:22px;letter-spacing:.5px}
  .topbar .sub{opacity:.92;font-size:13.5px}

  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(0,0,0,.05)}
  .card h2{margin:0 0 6px;font-size:17px}
  .card .muted{color:var(--muted);font-size:13px;margin:0 0 12px}

  .btn{display:inline-block;border:none;cursor:pointer;border-radius:10px;
    padding:11px 20px;font-size:15px;font-weight:600;transition:.15s;font-family:inherit}
  .btn.primary{background:var(--red);color:#fff}
  .btn.primary:hover{background:var(--red-dark)}
  .btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
  .btn.ghost:hover{border-color:var(--red);color:var(--red)}
  .btn.small{padding:6px 14px;font-size:13px}
  .btn.big{width:100%;padding:14px;font-size:16px;margin-top:6px}
  .btn.back{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.45);
    padding:8px 14px;font-size:13.5px;flex:0 0 auto;white-space:nowrap}
  .btn.back:hover{background:rgba(255,255,255,.32);border-color:#fff}

  .home-grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
  .home-card{background:var(--card);border:1px solid var(--line);border-radius:14px;
    padding:20px;cursor:pointer;transition:.15s}
  .home-card:hover{border-color:var(--red);box-shadow:0 4px 14px rgba(179,38,30,.12)}
  .home-card .icon{font-size:30px;margin-bottom:8px}
  .home-card h3{margin:0 0 4px;font-size:16px}
  .home-card p{margin:0;color:var(--muted);font-size:13px}

  .test-meta{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
  .chip{background:var(--red-soft);color:var(--red-dark);border-radius:8px;
    padding:4px 11px;font-size:12.5px;font-weight:600}

  .q-card{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:16px 18px;margin-bottom:14px}
  .q-card .qnum{display:inline-block;background:var(--red);color:#fff;border-radius:8px;
    font-size:12.5px;font-weight:700;padding:2px 10px;margin-right:8px}
  .q-card .stem{font-size:15.5px;font-weight:600;margin:8px 0 12px}
  .q-card .score-tag{float:right;color:var(--muted);font-size:12px;font-weight:400}

  .opt{display:flex;align-items:flex-start;gap:10px;border:1.5px solid var(--line);
    border-radius:10px;padding:9px 12px;margin-bottom:8px;cursor:pointer;transition:.12s;font-size:14.5px}
  .opt:hover{border-color:#c9cdd4;background:#fafafa}
  .opt input{display:none}
  .opt .letter{flex:0 0 24px;height:24px;border-radius:50%;background:#eef0f3;color:#444;
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
  .opt:has(input:checked){border-color:var(--red);background:var(--red-soft)}
  .opt:has(input:checked) .letter{background:var(--red);color:#fff}

  .fill-input{width:140px;border:1.5px solid var(--line);border-radius:8px;padding:6px 10px;
    font-size:15px;font-family:inherit;color:var(--ink)}
  .fill-input:focus{outline:none;border-color:var(--red)}
  .fill-q{font-size:15.5px;font-weight:600}
  .fill-q .input-inline{margin:0 4px;display:inline-block}

  textarea{width:100%;min-height:90px;border:1.5px solid var(--line);border-radius:10px;
    padding:10px 12px;font-size:14.5px;font-family:inherit;color:var(--ink);resize:vertical}
  textarea:focus{outline:none;border-color:var(--red)}

  .ref-answer{background:var(--ok-soft);border:1px solid #b7e0c2;border-radius:10px;
    padding:12px 14px;margin:10px 0;font-size:14px;color:#14532d}
  .ref-answer b{display:block;margin-bottom:4px}

  .self-assess{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .self-assess .sa{flex:1;min-width:96px;text-align:center;border:1.5px solid var(--line);
    border-radius:10px;padding:9px 6px;font-size:13.5px;cursor:pointer;transition:.12s}
  .self-assess .sa input{display:none}
  .self-assess .sa:has(input:checked){border-color:var(--red);background:var(--red-soft);font-weight:600}

  .submit-bar{margin-top:16px}
  .submit-bar .btn{width:100%;padding:15px;font-size:16.5px;box-shadow:0 6px 18px rgba(179,38,30,.35)}

  .result-head{text-align:center;padding:26px 20px;background:var(--card);
    border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
  .score-circle{width:120px;height:120px;border-radius:50%;margin:0 auto 12px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    border:6px solid var(--line);font-weight:700}
  .score-circle .num{font-size:34px;line-height:1}
  .score-circle .cap{font-size:11px;color:var(--muted)}
  .score-circle.pass{border-color:var(--ok);color:var(--ok)}
  .score-circle.fail{border-color:var(--bad);color:var(--bad)}
  .badge{display:inline-block;border-radius:999px;padding:5px 18px;font-size:15px;font-weight:700}
  .badge.pass{background:var(--ok-soft);color:var(--ok)}
  .badge.fail{background:#fdecea;color:var(--bad)}

  .type-score{display:flex;justify-content:space-between;align-items:center;
    border-bottom:1px dashed var(--line);padding:9px 0;font-size:14.5px}
  .type-score:last-child{border-bottom:none}
  .type-score .ts-score{font-weight:700}

  .review-item{border-left:4px solid var(--bad);background:#fff;border:1px solid var(--line);
    border-left-width:4px;border-radius:10px;padding:12px 14px;margin-bottom:10px;font-size:14px}
  .review-item .ri-q{font-weight:600;margin-bottom:6px}
  .review-item .ri-line{margin:3px 0}
  .review-item .ri-yours{color:var(--bad)}
  .review-item .ri-correct{color:var(--ok)}

  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .tab{padding:8px 16px;border-radius:999px;border:1.5px solid var(--line);cursor:pointer;
    font-size:13.5px;background:#fff;font-weight:600;color:var(--muted)}
  .tab.active{background:var(--red);color:#fff;border-color:var(--red)}

  .ans-toggle{background:var(--red-soft);color:var(--red-dark);border:none;border-radius:8px;
    padding:6px 14px;font-size:13px;font-weight:600;cursor:pointer;margin-top:8px}
  .answer-box{display:none;background:var(--ok-soft);border:1px solid #b7e0c2;border-radius:10px;
    padding:11px 13px;margin-top:10px;font-size:14px;color:#14532d}
  .answer-box.show{display:block}
  .answer-box b{display:block;margin-bottom:4px}

  .q-card .opt.correct{border-color:var(--ok);background:var(--ok-soft)}
  .q-card .opt.correct .letter{background:var(--ok);color:#fff}
  .q-card .opt.wrong{border-color:var(--bad);background:#fdecea}
  .q-card .opt.wrong .letter{background:var(--bad);color:#fff}
  .fill-input.correct{border-color:var(--ok);background:var(--ok-soft)}
  .fill-input.wrong{border-color:var(--bad);background:#fdecea}
  .check-btn{background:var(--red);color:#fff;border:none;border-radius:8px;padding:7px 16px;
    font-size:13.5px;font-weight:600;cursor:pointer;margin-top:10px;font-family:inherit}
  .check-btn:hover{background:var(--red-dark)}
  .result-box{display:none;border-radius:10px;padding:11px 13px;margin-top:10px;font-size:14px}
  .result-box.show{display:block}
  .result-box.ok{background:var(--ok-soft);border:1px solid #b7e0c2;color:#14532d}
  .result-box.bad{background:#fdecea;border:1px solid #f2b8b8;color:#7c1d1d}
  .result-box.partial{background:var(--warn-soft);border:1px solid #f0d9a8;color:#7c4a03}
  .result-box b{display:block;margin-bottom:4px}

  .empty{padding:40px;text-align:center;color:var(--muted)}
  .foot-note{text-align:center;color:var(--muted);font-size:12px;margin-top:26px}
  .row-btns{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}

  .to-top{position:fixed;right:16px;bottom:110px;z-index:50;display:none;align-items:center;justify-content:center;
    width:52px;height:52px;border-radius:50%;border:none;cursor:pointer;
    background:rgba(179,38,30,.92);color:#fff;font-size:13px;font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,.25);transition:opacity .3s;font-family:inherit}
  .to-top.show{display:flex}
  .to-top.idle{opacity:.28}

  /* 答案提示开关：常驻右下角悬浮按钮（与一键回顶同款，始终可见） */
  .ghost-toggle{position:fixed;right:16px;bottom:172px;z-index:50;display:flex;align-items:center;justify-content:center;
    gap:5px;padding:0 14px;height:46px;border-radius:23px;border:none;cursor:pointer;
    background:rgba(179,38,30,.92);color:#fff;font-size:13px;font-weight:700;
    box-shadow:0 4px 14px rgba(0,0,0,.25);transition:background .25s,opacity .3s;font-family:inherit;white-space:nowrap}
  .ghost-toggle.off{background:rgba(108,114,122,.92)}
  body.no-ghost .ghost-text{display:none !important}

  .explain-box{background:#f8fafc;border:1px dashed #c9cdd4;border-radius:10px;padding:10px 12px;margin-top:10px;font-size:13px}
  .explain-box>b{display:block;margin-bottom:6px;color:var(--muted);font-size:12.5px}
  .explain-item{margin:5px 0;padding:2px 0 2px 10px;border-left:3px solid transparent;line-height:1.65}
  .explain-item.wrong{border-left-color:var(--bad)}
  .explain-item.right{border-left-color:var(--ok)}

  /* 练习模式：灰色低透明度"幽灵答案"提示（随输入被覆盖而逐渐消失，不会一输入就整体消失） */
  .ghost-field{position:relative;display:inline-block;vertical-align:middle;overflow:hidden;
    border:1.5px solid var(--line);border-radius:8px;background:#fff}
  .ghost-field:focus-within{border-color:var(--red)}
  .ghost-field .ghost-text{position:absolute;left:0;top:0;max-width:100%;overflow:hidden;
    padding:6px 10px;color:#9aa0a6;opacity:.45;pointer-events:none;white-space:pre;z-index:0;
    font-size:15px;font-family:inherit;line-height:1.4}
  .ghost-field .fill-input{position:relative;z-index:1;border:none;background:transparent;line-height:1.4}
  .ghost-field.correct{border-color:var(--ok);background:var(--ok-soft)}
  .ghost-field.wrong{border-color:var(--bad);background:#fdecea}
  .ghost-field.correct .ghost-text,.ghost-field.wrong .ghost-text{display:none}
  .ghost-field.ghost-area{display:block;overflow:visible;border-radius:10px}
  .ghost-field.ghost-area .ghost-text{inset:0;padding:10px 12px;font-size:14.5px;
    white-space:pre-wrap;word-break:break-word;line-height:1.7}
  .ghost-field.ghost-area textarea{display:block;width:100%;min-height:90px;border:none;
    background:transparent;position:relative;z-index:1;line-height:1.7}
</style>
</head>
<body>
<div id="app"></div>
<button id="toTop" class="to-top" onclick="goTop()" aria-label="回到顶部">↑ 顶部</button>
<button id="ghostToggle" class="ghost-toggle" onclick="toggleGhost()" aria-label="答案提示开关">👁 答案提示：开</button>
<script>
const BANK = {
 "single": [
  {
   "q": "中国共产党的最高理想和最终目标是( )。",
   "options": [
    "实现共产主义",
    "实现共同富裕",
    "实现社会主义现代化",
    "全面建成小康社会"
   ],
   "answer": "A",
   "explain": {
    "A": "正确。实现共产主义是中国共产党的最高理想和最终目标。",
    "B": "错误。实现共同富裕是社会主义的本质要求，也是中国式现代化的重要特征，不是党的最高理想和最终目标。",
    "C": "错误。实现社会主义现代化是党在社会主义初级阶段的奋斗目标，基本实现社会主义现代化是到2035年的阶段目标，不是党的最高理想和最终目标。",
    "D": "错误。全面建成小康社会是党的第一个百年奋斗目标，已于2021年如期实现，不是党的最高理想和最终目标。"
   }
  },
  {
   "q": "党的根本宗旨是( )。",
   "options": [
    "解放思想、实事求是",
    "全心全意为人民服务",
    "理论联系实际",
    "密切联系群众"
   ],
   "answer": "B",
   "explain": {
    "A": "错误。解放思想、实事求是是党的思想路线的核心内容和精髓，不是党的根本宗旨。",
    "B": "正确。全心全意为人民服务是党的根本宗旨，是党的一切工作的出发点和落脚点。",
    "C": "错误。理论联系实际是党的三大优良作风之一，不是党的根本宗旨。",
    "D": "错误。密切联系群众是党的三大优良作风之一，不是党的根本宗旨。"
   }
  },
  {
   "q": "党的思想路线是( )。",
   "options": [
    "一切从实际出发,理论联系实际,实事求是,在实践中检验真理和发展真理",
    "解放思想,实事求是,与时俱进,求真务实",
    "群众路线",
    "批评与自我批评"
   ],
   "answer": "A",
   "explain": {
    "A": "正确。党章规定，党的思想路线是一切从实际出发，理论联系实际，实事求是，在实践中检验真理和发展真理。",
    "B": "错误。解放思想、实事求是、与时俱进、求真务实是对党的思想路线的精髓和品质的概括，不是党章规定的思想路线的完整表述。",
    "C": "错误。群众路线是党的根本工作路线，不是党的思想路线。",
    "D": "错误。批评与自我批评是党的三大优良作风之一，不是党的思想路线。"
   }
  },
  {
   "q": "现行党章是( )通过的。",
   "options": [
    "党的十九大",
    "党的二十大",
    "党的二十届三中全会"
   ],
   "answer": "B",
   "explain": {
    "A": "错误。党的十九大通过的是2017年的党章修正案，现行党章是其后党的二十大修改通过的。",
    "B": "正确。党的二十大审议通过了《中国共产党章程（修正案）》，这就是现行党章。",
    "C": "错误。党的二十届三中全会研究的是进一步全面深化改革、推进中国式现代化问题，不承担修改党章的任务。"
   }
  },
  {
   "q": "中国特色社会主义进入新时代,我国社会主要矛盾已经转化为( )。",
   "options": [
    "人民对于经济文化迅速发展的需要同当前经济文化不能满足人民需要的状况之间的矛盾",
    "人民日益增长的物质文化需要同落后的社会生产之间的矛盾",
    "人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾",
    "人民日益增长的物质生活需要和落后的社会生产之间的矛盾"
   ],
   "answer": "C",
   "explain": {
    "A": "错误。这是党的八大提出的我国国内主要矛盾的历史表述，不是新时代我国社会的主要矛盾。",
    "B": "错误。这是党的十一届六中全会以来长期沿用的社会主要矛盾表述，党的十九大已经作出主要矛盾转化的新判断。",
    "C": "正确。党的十九大指出，中国特色社会主义进入新时代，我国社会主要矛盾已经转化为人民日益增长的美好生活需要和不平衡不充分的发展之间的矛盾。",
    "D": "错误。该表述把物质文化需要误写为物质生活需要，且属于已经发生转化前的旧矛盾表述。"
   }
  },
  {
   "q": "中国共产党在社会主义初级阶段的基本路线的核心内容是( )",
   "options": [
    "一个中心,两个基本点",
    "自力更生,艰苦创业",
    "领导和团结全国各族人民"
   ],
   "answer": "A",
   "explain": {
    "A": "正确。以经济建设为中心，坚持四项基本原则，坚持改革开放，即一个中心、两个基本点，是党在社会主义初级阶段基本路线的核心内容。",
    "B": "错误。自力更生、艰苦创业是基本路线中实现奋斗目标的方针和途径，不是核心内容。",
    "C": "错误。领导和团结全国各族人民是基本路线规定的领导力量和依靠力量，不是核心内容。"
   }
  },
  {
   "q": "党员必须履行的义务有( )条。",
   "options": [
    "6",
    "8",
    "10"
   ],
   "answer": "B",
   "explain": {
    "A": "错误。党章规定党员必须履行的义务共八条，六条不符合党章规定。",
    "B": "正确。党章第三条明确规定了党员必须履行的八项义务。",
    "C": "错误。党章规定党员必须履行的义务为八条，十条不符合党章规定。"
   }
  },
  {
   "q": "党的组织制度中,党的最高领导机关是( )",
   "options": [
    "党的全国代表大会和它所产生的中央委员会",
    "中央政治局",
    "中央委员会总书记"
   ],
   "answer": "A",
   "explain": {
    "A": "正确。党章规定，党的最高领导机关是党的全国代表大会和它所产生的中央委员会。",
    "B": "错误。中央政治局及其常务委员会在中央委员会全体会议闭会期间行使中央委员会的职权，不是党的最高领导机关。",
    "C": "错误。中央委员会总书记负责召集中央政治局会议和中央政治局常务委员会会议，是党中央的主要负责人，不是党的最高领导机关。"
   }
  },
  {
   "q": "党的纪律处分有( )种。",
   "options": [
    "4",
    "5",
    "6"
   ],
   "answer": "B",
   "explain": {
    "A": "错误。党章规定党的纪律处分共五种，不是四种。",
    "B": "正确。党章规定，党的纪律处分有警告、严重警告、撤销党内职务、留党察看、开除党籍五种。",
    "C": "错误。党章规定党的纪律处分共五种，不是六种。"
   }
  },
  {
   "q": "申请入党的人,要填写入党志愿书,要有( )名正式党员作介绍人。",
   "options": [
    "1",
    "2",
    "3"
   ],
   "answer": "B",
   "explain": {

/* ---------- helpers ---------- */
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escNl(s){return esc(s).replace(/\n/g,'<br>');}
function shuffle(a){const r=a.slice();for(let i=r.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[r[i],r[j]]=[r[j],r[i]];}return r;}
function sample(a,n){return shuffle(a).slice(0,n);}
function normalize(s){
  const numMap={'一':'1','二':'2','三':'3','四':'4','五':'5','六':'6','七':'7','八':'8','九':'9','零':'0','〇':'0'};
  let r=String(s==null?'':s);
  r=r.replace(/[一二三四五六七八九零〇]/g,c=>numMap[c]);
  r=r.replace(/[\s，。、；：""''（）《》【】,.?？！：:;'"()<>\[\]·…—\-]/g,'');
  return r.toLowerCase();
}
function matchFill(user,ans){
  const u=normalize(user),a=normalize(ans);
  if(!u)return false;
  if(u===a)return true;
  if(a.length>3 && u.includes(a))return true;
  const ad=(a.match(/\d+/g)||[]).join('');
  if(ad){const ud=(u.match(/\d+/g)||[]).join('');if(ad===ud)return true;}
  return false;
}
function judgeShort(user,ref){
  const u=normalize(user),r=normalize(ref);
  if(!u)return 'empty';
  if(u===r || u.includes(r))return 'full';
  if(r.includes(u) && u.length>=2)return 'partial';
  return 'none';
}
function explainFrom(q){
  if(!q||!q.explain)return '';
  const letters='ABCDEF';
  let h='<div class="explain-box"><b>💡 选项解析</b>';
  (q.options||[]).forEach((o,j)=>{
    const L=letters[j];
    const e=q.explain[L];
    if(!e)return;
    h+=`<div class="explain-item ${(q.answer||'').includes(L)?'right':'wrong'}"><b>${L}. ${esc(o)}</b>：${esc(e)}</div>`;
  });
  return h+'</div>';
}

/* ---------- 一键回到顶部（防误触：滚过 400px 才出现，2.5 秒无滚动自动淡出，回顶后隐藏） ---------- */
let toTopTimer=null;
function goTop(){
  const b=document.getElementById('toTop');
  if(b)b.classList.remove('idle');
  window.scrollTo({top:0,behavior:'smooth'});
}
window.addEventListener('scroll',function(){
  const y=window.scrollY||document.documentElement.scrollTop||document.body.scrollTop;
  const b=document.getElementById('toTop');
  if(!b)return;
  if(y>400){
    if(!b.classList.contains('show'))b.classList.add('show');
    b.classList.remove('idle');
    clearTimeout(toTopTimer);
    toTopTimer=setTimeout(function(){b.classList.add('idle');},2500);
  }else{
    b.classList.remove('show','idle');
  }
});

  html+=`<div class="q-card"><h2 style="margin:0">${TYPES[2].section}（每题 2 分，共 20 分）</h2></div>`;

function renderChoice(q,i,key){
  const letters='ABCDEF';
  const multi = key==='multiple';
  const name = key+'-'+i;
  let opts='';
  q.options.forEach((opt,j)=>{
    const L=letters[j];
    opts+=`<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${name}" value="${L}">
      <span class="letter">${L}</span><span>${esc(opt)}</span></label>`;
  });
  return `<div class="q-card"><span class="qnum">${i+1}</span><span class="score-tag">${multi?'多选':'单选'}</span>
    <div class="stem">${esc(q.q)}</div>${opts}</div>`;
}

function renderFill(q,i){
  const runs=(q.q.match(/_+/g)||[]).length;
  const n=Math.max(runs,1);
  const parts=q.q.split(/_+/);
  let html='';
  for(let b=0;b<n;b++){
    if(b<parts.length)html+=esc(parts[b]);
    html+=`<input type="text" class="fill-input" data-fill="${i}" data-blank="${b}" placeholder="第${b+1}空" autocomplete="off">`;
  }
  html+=esc(parts[n]||'');
  return `<div class="q-card"><span class="qnum">${i+1}</span><span class="score-tag">填空</span>
    <div class="stem fill-q">${html}</div></div>`;
}

function renderSubjective(q,i,key){
  const isEssay = key==='essay';
  const hasRef = !isEssay && q.answer && q.answer.trim();
  let ref='';
  if(hasRef){
    ref=`<button class="ans-toggle" onclick="toggleRef(this)">显示参考答案</button>
      <div class="answer-box"><b>参考答案：</b>${escNl(q.answer)}</div>`;
  }else{
    ref=`<div class="ref-answer" style="background:var(--warn-soft);border-color:#f0d9a8;color:#7c4a03"><b>提示：</b>本题无标准答案，请结合自身实际作答后自评。</div>`;
  }
  const full = isEssay?20:10, half = isEssay?10:5;
  return `<div class="q-card"><span class="qnum">${i+1}</span><span class="score-tag">${isEssay?'论述':'简答'}（满分 ${full} 分）</span>
    <div class="stem">${esc(q.q)}</div>
    <textarea placeholder="在此作答（自评不影响文字保存，仅供参考）" data-subj="${key}-${i}"></textarea>
    ${ref}
    <div class="self-assess">
      <label class="sa"><input type="radio" name="self-${key}-${i}" value="full">完全正确 +${full}</label>
      <label class="sa"><input type="radio" name="self-${key}-${i}" value="partial">部分正确 +${half}</label>
      <label class="sa"><input type="radio" name="self-${key}-${i}" value="none" checked>未答对 +0</label>
    </div></div>`;
}

function toggleRef(btn){
  const box=btn.nextElementSibling;
  box.classList.toggle('show');
  btn.textContent = box.classList.contains('show')?'收起参考答案':'显示参考答案';
}

/* ---------- grading ---------- */
function submitTest(){
  const res={types:{},wrong:[],total:0};

  // single
  res.types.single={score:0,max:20};
  test.single.forEach((q,i)=>{
    const sel=document.querySelector(`input[name="single-${i}"]:checked`);
    const ua=sel?sel.value:'';
    const ok=ua===q.answer;
    if(ok)res.types.single.score+=1;
    else res.wrong.push({type:'single',label:'单选题',q:q.q,
      yours:ua||'（未作答）',
      correct:q.answer+'　'+q.options[q.answer.charCodeAt(0)-65],
      ans:q.answer, explain:q.explain||null, options:q.options||[]});
  });

  // multiple
  res.types.multiple={score:0,max:20};
  test.multiple.forEach((q,i)=>{
    const chosen=[];
    document.querySelectorAll(`input[name="multiple-${i}"]:checked`).forEach(c=>chosen.push(c.value));
    const ua=chosen.sort().join('');
    const ok=ua===q.answer;
    if(ok)res.types.multiple.score+=2;
    else{
      const correctText=q.answer.split('').map(L=>L+'　'+q.options[L.charCodeAt(0)-65]).join('；');
      res.wrong.push({type:'multiple',label:'多选题',q:q.q,
        yours:ua||'（未作答）',correct:q.answer+'　'+correctText,
        ans:q.answer, explain:q.explain||null, options:q.options||[]});
    }
  });

  // fill
  res.types.fill={score:0,max:20};
  test.fill.forEach((q,i)=>{
    const n=Math.max((q.q.match(/_+/g)||[]).length,1);
    let ans=q.answer.split(/[;；]/).map(s=>s.trim()).filter(Boolean);
    while(ans.length<n)ans.push('');
    let correctBlanks=0;
    const yourArr=[];
    for(let b=0;b<n;b++){
      const inp=document.querySelector(`input[data-fill="${i}"][data-blank="${b}"]`);
      const ua=inp?inp.value.trim():'';
      yourArr.push(ua||'（空）');
      const ok=matchFill(ua,ans[b]);
      if(ok)correctBlanks++;
    }
    const frac=correctBlanks/n;
    const got=Math.round(2*frac*10)/10;
    res.types.fill.score+=got;
    if(frac<1){
      res.wrong.push({type:'fill',label:'填空题',q:q.q,
        yours:yourArr.join('　/　'),correct:ans.join('　/　')});
    }
  });

  // short
  res.types.short={score:0,max:20};
  test.short.forEach((q,i)=>{
    const sel=document.querySelector(`input[name="self-short-${i}"]:checked`);
    const v=sel?sel.value:'none';
    const pts = v==='full'?10 : v==='partial'?5 : 0;
    res.types.short.score+=pts;
    if(v!=='full'){
      res.wrong.push({type:'short',label:'简答题',q:q.q,
        yours: v==='partial'?'（自评：部分正确）':'（自评：未答对）',
        correct:q.answer||'（无标准答案）'});
    }
  });

  // essay
  res.types.essay={score:0,max:20};
  test.essay.forEach((q,i)=>{
    const sel=document.querySelector(`input[name="self-essay-${i}"]:checked`);
    const v=sel?sel.value:'none';
    const pts = v==='full'?20 : v==='partial'?10 : 0;
    res.types.essay.score+=pts;
    if(v!=='full'){
      res.wrong.push({type:'essay',label:'论述题',q:q.q,
        yours: v==='partial'?'（自评：部分正确）':'（自评：未答对）',
        correct:'（无标准答案，请结合自身实际）'});
    }
  });

  res.total = Math.round(100*(res.types.single.score+res.types.multiple.score+res.types.fill.score+res.types.short.score+res.types.essay.score))/100;

  // save wrong to book
  saveWrong(res.wrong);

  showResult(res);
}

function saveWrong(items){
  try{
    const cur=JSON.parse(localStorage.getItem(WBOOK_KEY)||'[]');
    items.forEach(it=>{
      const dup=cur.some(c=>c.q===it.q && c.type===it.type);
      if(!dup)cur.push({type:it.type,label:it.label,q:it.q,answer:it.correct,ts:Date.now()});
    });
    localStorage.setItem(WBOOK_KEY,JSON.stringify(cur));
  }catch(e){}
}

function showResult(res){
  const pass=res.total>=PASS;
  const rows=TYPES.map(t=>{
    const s=res.types[t.key];
    return `<div class="type-score"><span>${t.section}（满分 ${s.max} 分）</span><span class="ts-score">${fmt(s.score)} 分</span></div>`;
  }).join('');

  let reviewHtml='';
  if(res.wrong.length){
    reviewHtml='<div class="card"><h2>错题回顾（'+res.wrong.length+' 题）</h2>';
    res.wrong.forEach((w,idx)=>{
      const ex=(w.explain&&w.options&&w.options.length)?explainFrom({explain:w.explain,options:w.options,answer:w.ans}):'';
      reviewHtml+=`<div class="review-item">
        <div class="ri-q">${idx+1}. 【${esc(w.label)}】${escNl(w.q)}</div>
        <div class="ri-line ri-yours">你的作答：${escNl(w.yours)}</div>
        <div class="ri-line ri-correct">正确答案：${escNl(w.correct)}</div>
        ${ex}
      </div>`;
    });
    reviewHtml+='</div>';
  }else{
    reviewHtml='<div class="card" style="text-align:center;color:var(--ok)">🎉 全部答对，太棒了！</div>';
  }

  $app().innerHTML=`
    ${topbar('📊 测试结果', '查看你的得分与错题回顾')}
    <div class="result-head">
      <div class="score-circle ${pass?'pass':'fail'}">
        <div class="num">${fmt(res.total)}</div><div class="cap">总分 / 100</div>
      </div>
      <div class="badge ${pass?'pass':'fail'}">${pass?'✅ 合格（≥'+PASS+' 分）':'❌ 未合格（合格线 '+PASS+' 分）'}</div>
    </div>
    <div class="card"><h2>分项得分</h2>${rows}</div>
    ${reviewHtml}
    <div class="row-btns">
      <button class="btn primary" onclick="startTest()">再测一次（重新随机组卷）</button>
      <button class="btn ghost" onclick="showHome()">返回首页</button>
    </div>`;
  window.scrollTo(0,0);
}

function fmt(n){return (Math.round(n*100)/100).toString();}

/* ---------- practice ---------- */
function showPractice(){
  $app().innerHTML=`
    ${topbar('📚 练习模式', '逐题作答，点「检查答案」判对错并查看选项解析')}
    <div style="display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px">
      <div class="tabs" id="tabs" style="margin-bottom:0">${TYPES.map(t=>`<span class="tab" data-t="${t.key}" onclick="switchTab('${t.key}')">${t.label}（${BANK[t.key].length}）</span>`).join('')}</div>
      <button class="btn ghost small" onclick="resetPractice()">重置</button>
    </div>
    <div id="plist"></div>`;
  switchTab('single');
}

function switchTab(key){
  curTab=key;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.t===key));
  const list=BANK[key];
  let html=list.map((q,i)=>practiceItem(key,q,i)).join('');
  document.getElementById('plist').innerHTML=html||'<div class="empty">暂无题目</div>';
  window.scrollTo(0,0);
}

function resetPractice(){
  switchTab(curTab);
}

function practiceItem(key,q,i){
  const letters='ABCDEF';
  let stem,body='';
  if(key==='single'||key==='multiple'){
    stem=esc(q.q);
    const multi=key==='multiple';
    const name='p-'+key+'-'+i;
    body='<div style="margin:4px 0">'+q.options.map((o,j)=>{
      const L=letters[j];
      return `<label class="opt"><input type="${multi?'checkbox':'radio'}" name="${name}" value="${L}">
        <span class="letter">${L}</span><span>${esc(o)}</span></label>`;
    }).join('')+'</div>';
  }else if(key==='fill'){
    const runs=(q.q.match(/_+/g)||[]).length;
    const n=Math.max(runs,1);
    let ans=q.answer.split(/[;；]/).map(s=>s.trim()).filter(Boolean);
    while(ans.length<n)ans.push('');
    const parts=q.q.split(/_+/);
    let h='';
    for(let b=0;b<n;b++){
      if(b<parts.length)h+=esc(parts[b]);
      h+=`<span class="ghost-field"><span class="ghost-text">${esc(ans[b])}</span><input type="text" class="fill-input" data-p-fill="${i}" data-blank="${b}" autocomplete="off"></span>`;
    }
    h+=esc(parts[n]||'');
    stem=h;
  }else{
    stem=esc(q.q);
    if(key==='essay'){
      body=`<textarea placeholder="在此作答（本题无标准答案，请结合自身实际）" data-p-short="${i}"></textarea>`;
    }else{
      body=`<div class="ghost-field ghost-area"><div class="ghost-text">${esc(q.answer||'')}</div><textarea data-p-short="${i}"></textarea></div>`;
    }
  }
  const btn = key==='essay' ? '' : `<button class="check-btn" onclick="checkPractice('${key}',${i})">检查答案</button>`;
  const box = `<div class="result-box" id="p-result-${key}-${i}"></div>`;
  return `<div class="q-card" id="p-card-${key}-${i}">
    <span class="qnum">${i+1}</span><span class="score-tag">${TYPES.filter(t=>t.key===key)[0].label}</span>
    <div class="stem">${stem}</div>${body}${btn}${box}</div>`;
}

function checkPractice(key,i){
  const q=BANK[key][i];
  const box=document.getElementById('p-result-'+key+'-'+i);
  let ok=false,verdict='',correctText='',level='ok';
  if(key==='single'){
    const sel=document.querySelector(`input[name="p-single-${i}"]:checked`);
    const ua=sel?sel.value:'';
    ok=ua===q.answer;
    document.querySelectorAll(`#p-card-single-${i} .opt`).forEach(lab=>{
      const inp=lab.querySelector('input');const L=inp?inp.value:'';
      lab.classList.remove('correct','wrong');
      if(L===q.answer)lab.classList.add('correct');
      else if(L===ua)lab.classList.add('wrong');
    });
    verdict=ok?'✅ 回答正确':(ua?'❌ 回答错误':'❌ 未作答');
    correctText='正确答案：'+q.answer+'　'+q.options[q.answer.charCodeAt(0)-65];
    level=ok?'ok':'bad';
  }else if(key==='multiple'){
    const chosen=[];
    document.querySelectorAll(`input[name="p-multiple-${i}"]:checked`).forEach(c=>chosen.push(c.value));
    const ua=chosen.sort().join('');
    ok=ua===q.answer;
    document.querySelectorAll(`#p-card-multiple-${i} .opt`).forEach(lab=>{
      const inp=lab.querySelector('input');const L=inp?inp.value:'';
      lab.classList.remove('correct','wrong');
      if(q.answer.includes(L))lab.classList.add('correct');
      else if(chosen.includes(L))lab.classList.add('wrong');
    });
    verdict=ok?'✅ 回答正确':(ua?'❌ 回答错误（错选、漏选均不得分）':'❌ 未作答');
    correctText='正确答案：'+q.answer+'　'+q.answer.split('').map(L=>L+'　'+q.options[L.charCodeAt(0)-65]).join('；');
    level=ok?'ok':'bad';
  }else if(key==='fill'){
    const runs=Math.max((q.q.match(/_+/g)||[]).length,1);
    let ans=q.answer.split(/[;；]/).map(s=>s.trim()).filter(Boolean);
    while(ans.length<runs)ans.push('');
    let allOk=true,anyEmpty=false;
    for(let b=0;b<runs;b++){
      const inp=document.querySelector(`input[data-p-fill="${i}"][data-blank="${b}"]`);
      const ua=inp?inp.value.trim():'';
      if(!ua)anyEmpty=true;
      const okb=matchFill(ua,ans[b]);
      const wrap=(inp&&inp.closest)?inp.closest('.ghost-field'):null;
      if(wrap){wrap.classList.remove('correct','wrong');wrap.classList.add(okb?'correct':'wrong');}
      if(!okb)allOk=false;
    }
    ok=allOk;
    verdict=ok?'✅ 回答正确':(anyEmpty?'❌ 有空格未填或填写错误':'❌ 回答错误');
    correctText='正确答案：'+ans.join('　/　');
    level=ok?'ok':'bad';
  }else if(key==='short'){
    const ta=document.querySelector(`textarea[data-p-short="${i}"]`);
    const ua=ta?ta.value:'';
    const v=judgeShort(ua,q.answer);
    if(v==='full'){ok=true;verdict='✅ 回答正确（与参考答案基本一致）';level='ok';}
    else if(v==='partial'){ok=false;verdict='🟡 回答不完整（部分要点吻合，请对照参考答案）';level='partial';}
    else if(v==='empty'){ok=false;verdict='❌ 未作答';level='bad';}
    else{ok=false;verdict='❌ 与参考答案不符（请对照参考答案）';level='bad';}
    correctText=q.answer;
  }
  box.className='result-box show '+level;
  box.innerHTML='<b>'+verdict+'</b>'+(correctText?escNl(correctText):'')+
    ((key==='single'||key==='multiple')?explainFrom(q):'');
}

/* ---------- wrong book ---------- */
function showWrongBook(){
  let wb=[];try{wb=JSON.parse(localStorage.getItem(WBOOK_KEY)||'[]');}catch(e){}
  let html=topbar('🔖 错题本', `共 ${wb.length} 题 · 错题自动收录，可随时清空`);
  if(!wb.length){
    html+='<div class="card empty">暂无错题。去「模拟测试」答一次题，错题会自动收录到这里。</div>';
  }else{
    html+='<div class="card">'+wb.map((w,i)=>`
      <div class="review-item" style="border-left-color:var(--warn)">
        <div class="ri-q">${i+1}. 【${esc(w.label)}】${escNl(w.q)}</div>
        <div class="ri-line ri-correct">答案：${escNl(w.answer)}</div>
      </div>`).join('')+'</div>';
    html+='<button class="btn ghost big" onclick="clearWrong()">清空错题本</button>';
  }
  $app().innerHTML=html;
  window.scrollTo(0,0);
}
function clearWrong(){
  if(confirm('确定清空错题本吗？')){localStorage.removeItem(WBOOK_KEY);showWrongBook();}
}

/* boot */
showHome();
</script>
